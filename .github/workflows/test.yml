name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: miner

env:
  CARGO_TERM_COLOR: always
  # Release, so the proof tests run (debug builds skip them), with the
  # overflow checks a debug build would have.
  RUSTFLAGS: -C overflow-checks=on

jobs:
  test:
    # TEMPORARY: off while the Windows compiler job's serial flake is fixed.
    if: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          # The dev networks' code and checks (built-in dataset, plans).
          - { name: linux-x64-dev, os: ubuntu-latest, features: dev }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: miner
      - run: cargo test --all --release --features "${{ matrix.features }}"

  # A debug build, for the debug_assert!s release builds leave out (the
  # proof tests skip themselves there; the slow ones are jobs below).
  debug:
    # TEMPORARY: off while the Windows compiler job's serial flake is fixed.
    if: false
    name: linux-arm64-debug
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: miner
      - run: cargo test --all

  # The tests marked #[ignore = "slow: …"], each in its own job so they
  # run side by side. A test marked slow must be listed here.
  slow:
    # TEMPORARY: off while the Windows compiler job's serial flake is fixed.
    if: false
    name: slow ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: aggregate::tests::chain_proofs_cover_history
          - test: aggregate::tests::the_chain_connects_only_proven_blocks
          - test: aggregate::tests::name_operations_roundtrip
          - test: aggregate::tests::aggregate_tree_roundtrip
          - test: aggregate::tests::spanning_transaction_roundtrip
          - test: aggregate::tests::proving_can_be_cancelled
          - test: aggregate::tests::aggregate_proof_roundtrip
          - test: aggregate::tests::deep_tree_roundtrip
          - test: aggregate::tests::mainnet_chain_constants
          - test: node::tests::an_idle_participant_is_quiet_and_learns_of_a_dead_hop
          - test: node::tests::sessions_come_back_after_the_relay_restarts
          - test: node::tests::standing_circuits_are_replaced_and_rebuilt
          - test: node::tests::a_false_claim_of_work_does_not_stall_the_sync
          - test: node::tests::a_false_claim_of_work_at_a_low_height_does_not_stall_the_sync
          - test: node::tests::a_switch_of_relays_keeps_messages_flowing
          - test: node::tests::an_issuer_carries_a_delegation_to_new_points
          - test: node::tests::delegations_and_sub_name_answers_reach_resolvers
          - test: node::tests::sub_name_certificates_are_held_at_their_points
          - test: node::tests::a_holder_carries_its_certificate_to_new_points
          - test: node::tests::a_fresh_node_fast_syncs_when_its_first_peer_comes_late
          - test: node::tests::rendezvous_points_meet_over_circuits
          - test: node::tests::a_switch_between_modes_falls_back
          - test: node::tests::messages_meet_over_a_lossy_network
          - test: node::tests::messages_meet_over_a_reordering_network
          - { test: aggregate::tests::dev_recursive_chain_constants, features: dev }
          # The circuits' soundness audits (stark::freedom_audit, run_audit).
          - test: block_air::tests::the_block_circuit_has_no_unintended_freedom
          - test: block_air::tests::a_replaced_permutation_is_caught_where_it_is_used
          - test: name_air::tests::has_no_unintended_freedom
          - test: block_air::tests::the_circuit_agrees_with_the_chain_on_random_blocks
          # The binary through its prompt (miner/tests/wallet.rs).
          - { test: sub_names_resolve_in_both_modes, features: dev, target: --test wallet }
          - { test: a_payment_goes_through_the_prompt, features: dev, target: --test wallet }
          - { test: a_name_is_registered_through_the_prompt, features: dev, target: --test wallet }
          - { test: exit_while_mining_ends_the_process, features: dev, target: --test wallet }
          - { test: a_reorganization_takes_lost_rewards_out_of_the_wallet, features: dev, target: --test wallet }
          - { test: a_reorganization_takes_a_lost_payment_out_of_the_wallet, features: dev, target: --test wallet }
          - { test: a_restored_wallet_finds_and_spends_beside_its_original, features: dev, target: --test wallet }
          - { test: a_crash_at_each_step_of_a_payment_loses_nothing, features: dev, target: --test wallet }
          - { test: miners_keep_going_through_a_reorganization_that_strands_transactions, features: dev, target: --test wallet }
          # At scale (miner/tests/scale.rs), with 2,000,000 outputs here;
          # 170,000,000 nightly on every platform but Windows arm64 (scale.yml).
          - { test: a_full_block_applies_on_a_large_state, features: dev, target: --test scale, nocapture: --nocapture }
          - { test: a_fresh_node_fast_syncs_a_large_state, features: dev, target: --test scale, nocapture: --nocapture }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: miner
          shared-key: slow
      - run: cargo test --release ${{ matrix.target || '--lib' }} --features "${{ matrix.features }}" -- --ignored --exact ${{ matrix.test }} ${{ matrix.nocapture }}

  # The fam compiler (node/): rebuilt from the 168-byte seed under QEMU
  # (scripts/build.sh checks the rebuilt fam0 against the seed), then its
  # regression checks (scripts/check.sh).
  compiler:
    # TEMPORARY: off while the Windows compiler job's serial flake is fixed.
    if: false
    name: compiler ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: node
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc xxd
      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu
      - run: qemu-system-riscv32 --version
      - name: Build from the seed
        run: sh scripts/build.sh
      - name: Checks
        run: sh scripts/check.sh

  compiler-windows:
    name: compiler windows-x64 ${{ matrix.copy }}
    runs-on: windows-latest
    timeout-minutes: 45
    # TEMPORARY: four copies, the checks five times each, to catch the
    # intermittent serial failure; back to one run when it is fixed.
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    defaults:
      run:
        shell: msys2 {0}
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: diffutils perl vim mingw-w64-ucrt-x86_64-qemu
      - run: qemu-system-riscv32 --version
      - name: Build from the seed
        run: sh scripts/build.sh
      - name: Checks, five times
        run: |
          fails=0
          for i in 1 2 3 4 5; do
            echo "--- round $i"
            sh scripts/check.sh || fails=$((fails + 1))
          done
          echo "$fails of 5 rounds failed"
          [ "$fails" = 0 ]

  # Every test marked slow has a job above.
  slow-listed:
    # TEMPORARY: off while the Windows compiler job's serial flake is fixed.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: compare the marked tests with the matrix
        working-directory: .
        run: |
          marked=$(grep -rh -A1 'ignore = "slow: one job each' miner/src miner/tests | grep -o 'fn [a-z0-9_]*' | sed 's/fn //' | sort)
          listed=$(grep -o 'test: [a-z][a-z_0-9:]*' .github/workflows/test.yml | sed 's/.*[: ]//' | sort)
          diff <(echo "$marked") <(echo "$listed")
