name: compiler

# The fam compiler (node/): rebuild it from the 168-byte seed under QEMU
# (scripts/build.sh checks the rebuilt fam0 against the seed), then run its
# regression checks (scripts/check.sh) on every platform the tools support.

on:
  push:
    branches: [main]
    paths: [node/**, .github/workflows/compiler.yml]
  pull_request:
    paths: [node/**, .github/workflows/compiler.yml]
  workflow_dispatch:

defaults:
  run:
    working-directory: node

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc xxd
      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu
      - run: qemu-system-riscv32 --version
      - name: Build from the seed
        run: sh scripts/build.sh
      - name: Checks
        run: sh scripts/check.sh

  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: diffutils perl vim mingw-w64-ucrt-x86_64-qemu
      - run: qemu-system-riscv32 --version
      - name: Build from the seed
        run: sh scripts/build.sh
      - name: Checks
        run: sh scripts/check.sh
