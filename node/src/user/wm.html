function wrow(p,k,v){var r=el('div','wrow',p);el('span','wk',r).textContent=k;el('span','wv',r).textContent=v==null?'':String(v);return r}
function wbad(p,m){if(m.ok)return false;el('div','werr',p).textContent='Error: '+(m.error||'unknown');return true}
function wfield(f,label,type){el('label','',f).textContent=label;var i=el(type=='select'?'select':'input','',f);if(type!='select')i.type=type;return i}
function wbtn(f,label,fn){var b=el('button','wgo',f);b.textContent=label;b.onclick=fn;return b}
function wh(p,s){el('div','wh',p).textContent=s}
function wwait(s){return s<3600?Math.round(s/60)+' min':(s<86400?Math.round(s/3600)+' h':Math.round(s/86400)+' days')}
function wshow(w,t){
w.tab=t;w.tabs.forEach(function(b){if(b.tab==t)b.classList.add('on');else b.classList.remove('on')});
if(w.b)w.b.remove();
var p=w.b=el('div','wbody',w.t);
if(!w.unl){el('div','',p).textContent=w.lockmsg||'Unlocking...';return}
if(w.none&&t!='settings'){
wh(p,'No wallet yet');el('div','',p).textContent='Create one here, or restore one from its phrase in Settings.';
var co=el('div','wv',p);
wbtn(p,'Create a wallet',function(){wask(w,'create',{},function(m){if(wbad(co,m))return;w.none=false;co.textContent='Write these words down, in order: '+m.words})});
return;
}
if(t=='overview')wask(w,'overview',{},function(m){
if(wbad(p,m))return;
wh(p,'Balance');wrow(p,'Confirmed',m.confirmed);wrow(p,'Pending',m.pending);wrow(p,'Unverified',m.unverified);wrow(p,'Reserved',m.reserved);wrow(p,'Locked',m.locked);
wh(p,'Node');wrow(p,'Tip',m.height);wrow(p,'State',m.node);
});
else if(t=='receive'){
var a=el('div','',p);
wask(w,'receive',{},function(m){if(wbad(a,m))return;wh(a,'This wallet');wrow(a,'Address',m.address);if(m.name)wrow(a,'Name',m.name)});
var f=el('div','wf',p);wh(f,'Answer a slate file');
var s=wfield(f,'Slate file (in your home)','text'),o=el('div','wv',f);
wbtn(f,'Answer',function(){wask(w,'answer',{slate:s.value},function(m){o.textContent=m.ok?'Answered: '+m.slate+' ('+m.amount+'); send it back to the payer':'Error: '+m.error})});
}
else if(t=='send'){
var f=el('div','wf',p);wh(f,'Pay by slate file');
var to=wfield(f,'To (an address or a @name)','text'),am=wfield(f,'Amount','text'),sp=wfield(f,'Speed','select'),sl=wfield(f,'Slate file to write','text'),o=el('div','wv',f);
wask(w,'fees',{},function(m){if(m.ok)m.speeds.forEach(function(x){var e=el('option','',sp);e.value=x.speed;e.textContent=x.speed+': '+x.rate+', about '+wwait(x.wait)})});
wbtn(f,'Make the slate',function(){wask(w,'send',{to:to.value,amount:am.value,speed:sp.value,slate:sl.value},function(m){o.textContent=m.ok?'Written: '+m.slate+' (fee '+m.fee+'); give it to the recipient, then finalize their answer':'Error: '+m.error})});
var g=el('div','wf',p);wh(g,'Finalize an answered slate');
var fs=wfield(g,'Answered slate file','text'),fo=el('div','wv',g);
wbtn(g,'Finalize',function(){wask(w,'finalize',{slate:fs.value},function(m){fo.textContent=m.ok?'Sent: '+m.tx+' (fee '+m.fee+')':'Error: '+m.error})});
}
else if(t=='activity')wask(w,'activity',{},function(m){
if(wbad(p,m))return;
if(!m.items.length)el('div','',p).textContent='Nothing yet.';
m.items.forEach(function(x){
var r=wrow(p,x.kind,x.amount+'  '+x.state+(x.height?' at '+x.height:'')+'  '+x.tx.slice(0,16));
if(x.state=='pending'){
var re=function(m){if(m.ok)wshow(w,'activity');else el('div','werr',p).textContent='Error: '+m.error};
wbtn(r,'Cancel',function(){wask(w,'cancel',{tx:x.tx},re)});
wbtn(r,'Bump',function(){wask(w,'bump',{tx:x.tx,speed:'hour'},re)});
}
});
});
else{
var f=el('div','wf',p);wh(f,'Recovery phrase');
var pw=wfield(f,'Password','password'),o=el('div','wv',f);
wbtn(f,'Show the phrase',function(){wask(w,'phrase',{password:pw.value},function(m){pw.value='';o.textContent=m.ok?m.words:'Error: '+m.error})});
var g=el('div','wf',p);wh(g,'Restore from a phrase');
var ph=wfield(g,'The 12 words','text'),pp=wfield(g,'Passphrase (if any)','password'),go=el('div','wv',g);
wbtn(g,'Restore',function(){wask(w,'restore',{words:ph.value,passphrase:pp.value},function(m){ph.value='';pp.value='';if(m.ok)w.none=false;go.textContent=m.ok?'Restored; scanning the chain':'Error: '+m.error})});
wbtn(g,'Scan again',function(){wask(w,'scan',{},function(m){go.textContent=m.ok?'Scanning the chain':'Error: '+m.error})});
}
}
function wmsg(w,m){
if(m.op=='unlock'&&m.id==null){w.unl=!!m.ok;w.none=m.wallet===false;w.lockmsg=m.ok?'':'Locked: '+(m.error||'');wshow(w,w.tab);return}
if(m.event=='tip'){w.st.textContent='Tip '+m.height;return}
if(m.event=='scan'){w.st.textContent='Scanned '+m.height+' of '+m.of;return}
if(m.event){if(w.unl&&(w.tab=='overview'||w.tab=='activity'))wshow(w,w.tab);return}
var cb=w.q[m.id];if(cb){delete w.q[m.id];cb(m)}
}
function openwal(){
if(walw){focusw(walw);return walw}
var w=walw=frame('Wallet',620,460);w.q={};w.nid=0;w.tab='overview';
w.t=el('div','wal',w.d);w.t.tabIndex=0;
var nav=el('div','wnav',w.t);
w.tabs=WTABS.map(function(x){var b=el('button','wtab',nav);b.tab=x[0];b.textContent=x[1];b.onclick=function(){wshow(w,x[0])};return b});
w.st=el('span','wst',nav);
w.t.onfocus=function(){if(topw()!=w)focusw(w)};
w.ws=new WebSocket(wsbase+'/wallet');
w.ws.onopen=function(){w.up=1};
w.ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}wmsg(w,m)};
w.ws.onclose=w.ws.onerror=function(){
if(w.up){closew(w);return}
if(w.done)return;
w.done=1;w.unl=false;w.lockmsg='[no wallet: the server has none free]';wshow(w,w.tab);
};
wins.push(w);focusw(w);wshow(w,w.tab);
return w;
}
document.getElementById('newt').onclick=function(){openw()};
document.getElementById('neww').onclick=function(){openwal()};
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,10000);
</script></body></html>
